<?plantuml 1.2026.0?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="220px" preserveAspectRatio="none" style="width:1168px;height:220px;background:#FFFFFF;" version="1.1" viewBox="0 0 1168 220" width="1168px" zoomAndPan="magnify"><defs/><g><!--cluster QRC--><g class="cluster" data-qualified-name="QRC" data-source-line="7" id="ent0003"><rect fill="none" height="207" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:1;" width="539.85" x="314.26" y="7"/><text fill="#000000" font-family="'Arial'" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="111.0977" x="528.6362" y="21.9951">qr-c container</text></g><!--entity Socat--><g class="entity" data-qualified-name="QRC.Socat" data-source-line="8" id="ent0004"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="97.998" x="377.74" y="145.7"/><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="37.625" x="387.74" y="168.6951">socat</text><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="77.998" x="387.74" y="184.992">TCP -&gt; PTY</text></g><!--entity PTY--><g class="entity" data-qualified-name="QRC.PTY" data-source-line="9" id="ent0005"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="113.8916" x="724.22" y="83.55"/><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="75.9814" x="734.22" y="106.5451">PTY device</text><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="74.5049" x="734.22" y="122.842">/tmp/ttyS1</text><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="93.8916" x="734.22" y="139.1389">(local to qr-c)</text></g><!--entity App--><g class="entity" data-qualified-name="QRC.App" data-source-line="10" id="ent0006"><rect fill="#F1F1F1" height="68.8906" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="192.9629" x="330.26" y="41.55"/><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="64.0391" x="340.26" y="64.5451">C++ app</text><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="169.1348" x="340.26" y="80.842">JobRunner reads frames</text><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="172.9629" x="340.26" y="97.1389">(COBS + 0x00 delimiter)</text></g><!--entity Fake--><g class="entity" data-qualified-name="Fake" data-source-line="6" id="ent0002"><rect fill="#F1F1F1" height="52.5938" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="151.2568" x="7" y="145.7"/><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="73.3018" x="17" y="168.6951">fake-serial</text><text fill="#000000" font-family="'Arial'" font-size="14" lengthAdjust="spacing" textLength="131.2568" x="17" y="184.992">(TCP server :7000)</text></g><g class="entity" data-qualified-name="GMN10" data-source-line="18" id="ent0011"><path d="M901.11,75.17 L901.11,114 L838.48,118 L901.11,122 L901.11,160.8341 A0,0 0 0 0 901.11,160.8341 L1161.569,160.8341 A0,0 0 0 0 1161.569,160.8341 L1161.569,85.17 L1151.569,75.17 L901.11,75.17 A0,0 0 0 0 901.11,75.17" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1151.569,75.17 L1151.569,85.17 L1161.569,85.17 L1151.569,75.17" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="225.3989" x="907.11" y="92.2369">PTY nodes live in /dev/pts (devpts)</text><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="232.8765" x="907.11" y="107.3697">and are namespaced per container.</text><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="4.1323" x="907.11" y="122.5025">&#160;</text><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="239.459" x="907.11" y="137.6353">Do NOT share /tmp/ttyS1 via volume</text><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="155.3716" x="907.11" y="152.7681">from another container.</text></g><!--link Fake to Socat--><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" data-link-type="dependency" data-source-line="13" id="lnk7"><path d="M158.71,172 C225.29,172 314.55,172 371.47,172" fill="none" id="Fake-to-Socat" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="377.47,172,368.47,168,372.47,172,368.47,176,377.47,172" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="108.0054" x="189.26" y="153.0669">TCP byte stream</text><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="96.0781" x="195.2236" y="168.1997">(COBS frames)</text></g><!--link Socat to PTY--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="14" id="lnk8"><path d="M475.9,170.83 C529.66,168.76 619,162.99 694.22,147 C703.92,144.94 708.3331,143.9196 718.0931,140.8696" fill="none" id="Socat-to-PTY" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="723.82,139.08,714.0366,137.9466,719.0476,140.5714,716.4228,145.5824,723.82,139.08" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="110.6016" x="568.72" y="128.0669">creates local PTY</text><text fill="#000000" font-family="'Arial'" font-size="13" lengthAdjust="spacing" textLength="107.9927" x="570.0244" y="143.1997">and writes bytes</text></g><!--link App to PTY--><g class="link" data-entity-1="ent0006" data-entity-2=