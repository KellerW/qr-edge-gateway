name: CI
on:
  push:
  pull_request:

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format cmake ninja-build g++ --no-install-recommends libasio-dev

      - name: Configure (for format target)
        run: cmake -S qr-c/src -B build -G Ninja

      - name: Run clang-format (and fail if changes)
        run: |
          cmake --build build --target format
          git diff --exit-code

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure
        run: |
          cmake -S qr-c/src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_UNIT_TEST=ON

      - name: Build
        run: cmake --build build -j 2

      - name: Run unit tests
        run: ctest --test-dir build --output-on-failure

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Build images (compose)
        run: docker compose build

      - name: Run integration tests (api-test)
        run: |
          docker compose --profile test up --build \
            --abort-on-container-exit --exit-code-from api-test api-test

      - name: Collect compose logs
        if: always()
        run: |
          docker compose logs --no-color > docker-compose.log || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-artifacts
          path: |
            docker-compose.log
            logs/

  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Run contract tests (Schemathesis)
        run: |
          docker compose --profile test up --build \
            --abort-on-container-exit --exit-code-from contract-test contract-test

      - name: Collect compose logs
        if: always()
        run: |
          docker compose logs --no-color > docker-compose-contract.log || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            docker-compose-contract.log
            logs/
