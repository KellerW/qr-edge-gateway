name: CI

on:
  push:
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      # Opcional: cache do BuildKit para builds mais rápidos
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build images (compose)
        run: |
          docker compose build

      - name: Run integration tests (api-test)
        run: |
          # Sobe somente api-test; ele puxa qr-c e fake-serial via depends_on.
          # --exit-code-from garante que o job falha se o teste falhar.
          docker compose up --abort-on-container-exit --exit-code-from api-test api-test

      - name: Collect compose logs
        if: always()
        run: |
          docker compose ps || true
          docker compose logs --no-color > docker-compose.log || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-artifacts
          path: |
            docker-compose.log
            logs/

  contract:
    # Rodar contract tests só em PR (ajustável)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Run contract tests (profile test)
        run: |
          docker compose --profile test up --build --abort-on-container-exit --exit-code-from contract-test contract-test

      - name: Collect compose logs
        if: always()
        run: |
          docker compose logs --no-color > docker-compose-contract.log || true

      - name: Tear down
        if: always()
        run: |
          docker compose down -v || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            docker-compose-contract.log
            logs/
