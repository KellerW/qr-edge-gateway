name: CI

on:
  push:
  pull_request:

jobs:
  format-check:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - name: Install tools
      run: |
        sudo apt-get update
        sudo apt-get install -y clang-format cmake ninja-build g++

    - name: Configure
      working-directory: qr-c/src
      run: cmake -S . -B build -G Ninja

    - name: Format check
      working-directory: qr-c/src
      run: cmake --build build --target format-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker versions
        run: |
          docker version
          docker compose version

      - name: Build images (compose)
        run: docker compose build

      - name: Run integration tests (api-test)
        run: docker compose up --abort-on-container-exit --exit-code-from api-test api-test

      - name: Collect compose logs
        if: always()
        run: |
          docker compose logs --no-color > docker-compose.log || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-artifacts
          path: |
            docker-compose.log
            logs/

  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run contract tests (profile test)
        run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from contract-test contract-test

      - name: Collect compose logs
        if: always()
        run: docker compose logs --no-color > docker-compose-contract.log || true

      - name: Tear down
        if: always()
        run: docker compose down -v || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-artifacts
          path: |
            docker-compose-contract.log
            logs/
