services:
  fake-serial:
    image: alpine:3.19
    container_name: fake-serial
    command: >
      sh -c '
        apk add --no-cache socat busybox-extras &&
        echo "[fake-serial] TCP server on :7000" &&
        while true; do
          { while true; do printf "QR:%s\n" "123456"; sleep 2; done; } |
          socat - TCP-LISTEN:7000,reuseaddr,fork;
        done
      '
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7000"]
      interval: 5s
      timeout: 3s
      retries: 10

  qr-c:
    build:
      context: ./qr-c
      dockerfile: Dockerfile
    container_name: qr-c
    environment:
      SERIAL_PORT: /tmp/ttyS1
      LOG_PATH: /var/log/qr-c/qr-c.log
      FAKE_SERIAL_HOST: fake-serial
      FAKE_SERIAL_PORT: 7000
      REST_BIND: 0.0.0.0
      REST_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./logs/qr-c:/var/log/qr-c
    depends_on:
      fake-serial:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -e /tmp/ttyS1"]
      interval: 5s
      timeout: 3s
      retries: 10

  gateway-py:
    image: python:3.12-slim
    container_name: gateway-py
    working_dir: /app
    environment:
      MQTT_HOST: test.mosquitto.org
      MQTT_PORT: 8883
      MQTT_CERT: /tmp/mosquitto.org.crt
      MQTT_TOPIC_CMD: from_cloud/commands
      MQTT_TOPIC_EVENT: from_device/events
      LOG_PATH: /var/log/gateway-py/gateway.log
    command: >
      sh -c '
        echo "[gateway-py] up (placeholder) MQTT_HOST=$$MQTT_HOST" &&
        mkdir -p /var/log/gateway-py &&
        touch $$LOG_PATH &&
        sleep infinity
      '
    volumes:
      - ./logs/gateway-py:/var/log/gateway-py
    depends_on:
      qr-c:
        condition: service_healthy
