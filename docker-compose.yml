services:
  fake-serial:
    build:
      context: ./fake_serial
      dockerfile: Dockerfile
    environment:
      FAKE_SERIAL_PORT: 7000
      PARCEL_PAYLOAD: "QR:123456"
      PARCEL_INTERVAL_MS: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 7000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  qr-c:
    build:
      context: ./qr-c
      dockerfile: Dockerfile
    environment:
      SERIAL_PORT: /tmp/ttyS1
      FAKE_SERIAL_HOST: fake-serial
      FAKE_SERIAL_PORT: 7000
      REST_BIND: 0.0.0.0
      REST_PORT: 8080
      # Se o seu entrypoint ainda usa LOG_PATH, descomente:
      # LOG_PATH: /var/log/qr-c/qr-c.log
      # Se você usa o novo logging:
      # LOG_LEVEL: info
      # LOG_FILE: ""   # stdout only
    ports:
      - "8080:8080"
    #volumes:
    #  - ./logs/qr-c:/var/log/qr-c
    depends_on:
      fake-serial:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health | grep -q '\"ok\":true'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api-test:
    profiles: ["test"]
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      qr-c:
        condition: service_healthy
    environment:
      BASE_URL: http://qr-c:8080
      TIMEOUT_MS: 1000
      POLL_INTERVAL: 0.3
      POLL_MAX_SECONDS: 6.0

  contract-test:
    profiles: ["test"]
    build:
      context: ./tests/contract
      dockerfile: Dockerfile
    depends_on:
      qr-c:
        condition: service_healthy
    volumes:
      - ./docs:/spec:ro
  unit-test:
    profiles: ["test"]
    build:
      context: ./qr-c
      dockerfile: Dockerfile
      target: build
    command: sh -lc "ctest --test-dir /work/build --output-on-failure"

  gateway-py:
    build:
      context: ./gateway-py
      dockerfile: Dockerfile
    environment:
      MQTT_HOST: broker.emqx.io
      MQTT_PORT: 8883
      MQTT_CERT: /tmp/broker.emqx.io-ca.crt
      MQTT_TOPIC_CMD: from_cloud/commands
      MQTT_TOPIC_EVENT: from_device/events
      LOG_PATH: /var/log/gateway-py/gateway.log
      QR_API_BASE_URL: http://qr-c:8080
      QR_START_TIMEOUT_MS: 1000
      POLL_INTERVAL_SEC: 0.3
      POLL_MAX_SECONDS: 6.0
    volumes:
      - ./logs/gateway-py:/var/log/gateway-py
    depends_on:
      qr-c:
        condition: service_healthy
    healthcheck:
      # Simple check: process exists
      test: ["CMD-SHELL", "python -c 'import os,signal; os.kill(1,0)'"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  